name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Evaluates the whole laptop config, so option typos and syntax errors
      # show up here before the laptop tries to build them.
      - run: nix flake check --show-trace
