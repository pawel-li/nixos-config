name: update flake.lock

# Moves nixpkgs to the latest nixos-26.05 commit (and nixpkgs-unstable, used
# only for Immich, to the latest unstable) once a week. The laptop picks the new
# commit up like any other push, so it gets security updates on its own.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake update
      - run: nix flake check --show-trace
      - run: nix eval --raw --show-trace .#nixosConfigurations.laptop.config.system.build.toplevel.drvPath
      - name: Commit flake.lock if it changed
        run: |
          git add flake.lock
          if git diff --cached --quiet; then
            echo "flake.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake.lock: update nixpkgs"
          git push
